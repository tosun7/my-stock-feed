<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Stock Feed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f1115;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      min-height: 100vh;
      padding: 20px 12px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .channel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #1a1d24;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid #2a2d34;
    }

    .channel-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2a4d8a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }

    .channel-info {
      flex: 1;
    }

    .channel-name {
      font-size: 15px;
      font-weight: 600;
      color: #6da3e8;
    }

    .channel-desc {
      font-size: 12px;
      color: #8a8a8a;
      margin-top: 2px;
    }

    .live-indicator {
      font-size: 11px;
      color: #6dd49e;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6dd49e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
      background: #1a1d24;
    }

    .stat {
      background: #22252c;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: #8a8a8a;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .filters {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      background: #1a1d24;
      overflow-x: auto;
      flex-wrap: wrap;
    }

    .filter-chip {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 14px;
      background: #2a2d34;
      color: #b0b0b0;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-chip:hover {
      background: #3a3d44;
    }

    .filter-chip.active {
      background: #2a4d8a;
      color: #fff;
    }

    .news-section {
      background: #1a1d24;
      padding: 12px 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .news-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      font-size: 14px;
      line-height: 1.5;
      border-bottom: 1px solid #2a2d34;
      cursor: pointer;
      transition: background 0.2s;
    }

    .news-item:hover {
      background: #22252c;
      margin: 0 -16px;
      padding: 12px 16px;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-icon {
      font-size: 16px;
      flex-shrink: 0;
      width: 22px;
    }

    .news-content {
      flex: 1;
      min-width: 0;
    }

    .news-time {
      color: #8a8a8a;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .news-headline {
      color: #e0e0e0;
    }

    .ticker {
      display: inline-block;
      padding: 1px 6px;
      background: #2a3d5c;
      color: #6da3e8;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
      vertical-align: middle;
    }

    .ticker.hot {
      background: #5c2a2a;
      color: #e88a8a;
    }

    .ticker.green {
      background: #1f4d3a;
      color: #6dd49e;
    }

    .footer {
      background: #1a1d24;
      padding: 14px 16px;
      border-radius: 0 0 12px 12px;
      text-align: center;
      font-size: 12px;
      color: #6a6a6a;
    }

    @media (max-width: 480px) {
      body { padding: 8px 0; }
      .container { padding: 0 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="channel-header">
      <div class="channel-avatar">VB</div>
      <div class="channel-info">
        <div class="channel-name">MY STOCK FEED</div>
        <div class="channel-desc">AI 인프라 + 메모리 + 매크로</div>
      </div>
      <div class="live-indicator">
        <span class="live-dot"></span>
        라이브
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">오늘 수집</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">실적</div>
        <div class="stat-value" id="stat-earning">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">매크로</div>
        <div class="stat-value" id="stat-macro">0</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-chip active" data-filter="all">전체</button>
      <button class="filter-chip" data-filter="memory">메모리/HBM</button>
      <button class="filter-chip" data-filter="power">AI 전력</button>
      <button class="filter-chip" data-filter="optic">광학/패키징</button>
      <button class="filter-chip" data-filter="bigtech">빅테크 capex</button>
      <button class="filter-chip" data-filter="earning">실적시즌</button>
      <button class="filter-chip" data-filter="macro">매크로</button>
    </div>

    <div class="news-section">
      <div class="section-title">📰 최신 뉴스</div>
      <div id="news-list">
      </div>
    </div>

    <div class="footer">
      마지막 업데이트: <span id="last-update">-</span>
    </div>
  </div>

  <script>
   let newsData = [];

    function updateStats() {
      document.getElementById('stat-total').textContent = newsData.length;
      document.getElementById('stat-earning').textContent =
        newsData.filter(n => n.category === 'earning').length;
      document.getElementById('stat-macro').textContent =
        newsData.filter(n => n.category === 'macro').length;
    }

    function renderNewsItem(news) {
      const tickerHtml = news.ticker
        ? `<span class="ticker ${news.tickerType || ''}">${news.ticker}</span>`
        : '';

      return `
        <div class="news-item">
          <span class="news-icon">${news.icon}</span>
          <div class="news-content">
            <div class="news-time">${news.time}</div>
            <div class="news-headline">${news.headline}${tickerHtml}</div>
          </div>
        </div>
      `;
    }

    function renderNews(filter = 'all') {
      const filtered = filter === 'all'
        ? newsData
        : newsData.filter(n => n.category === filter);

      const html = filtered.map(renderNewsItem).join('');
      document.getElementById('news-list').innerHTML = html ||
        '<div style="text-align: center; padding: 30px; color: #6a6a6a;">해당 카테고리 뉴스 없음</div>';
    }

    function updateTimestamp() {
      const now = new Date();
      const formatted = now.toLocaleString('ko-KR');
      document.getElementById('last-update').textContent = formatted;
    }

    function setupFilters() {
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          renderNews(chip.dataset.filter);
        });
      });
    }

function isJunkNews(headline) {
  if (!headline || headline.length < 10) return true;

  const blacklist = [
    '리딩방', '무료 리딩', '매수 추천', '매도 추천',
    '특급 매매', '급등 임박', '지금 사야',
    '추천 종목', '오늘의 종목', 'TOP 5',
    '100% 수익', '대박 종목', '필수 매수',
    '비밀 정보', '특급 정보',
    '★', '☆', '◆', '◇', '■', '□'
  ];

  for (const word of blacklist) {
    if (headline.includes(word)) return true;

  }

  const words = headline.split(/\s+/);
  const wordCount = {};
  for (const word of words) {
    if (word.length < 2) continue;
    wordCount[word] = (wordCount[word] || 0) + 1;
    if (wordCount[word] >= 3) return true;
  
  }

  if (/^[\d\s%원달러]+$/.test(headline)) return true;

  return false;
}

const CATEGORY_KEYWORDS = {
  optic: [

    '광 트랜시버', '트랜시버',
    '광섬유', '광 케이블',
    'CPO', 'co-packaged',
    '첨단 패키징', '패키징',
    'FC-BGA', 'FCBGA',
    'EMIB', 'Camtek',
    'Coherent', 'Lumentum'
  ],

  memory: [
    'HBM', 'HBM3', 'HBM4', 'HBM3E',
    '메모리', 'DRAM', 'NAND', '낸드',
    '디램', '낸드플래시',
    'SK하이닉스', '하이닉스',
    '마이크론', 'Micron',
    '삼성전자 메모리'
  ],

  power: [

    'HD현대일렉', '현대일렉',

    'Eaton', 'Quanta',
    '백악관', 'Ratepayer',
    '전력반도체', 'SiC', 'GaN'
  ],

  earning: [
    '실적', '실적 발표', '실적발표',
    '1Q', '2Q', '3Q', '4Q',
    '분기 실적', '컨센서스',
    'EPS', '영업이익', '매출',

    'capex', 'CapEx',

    '오픈AI', 'OpenAI',
    'Anthropic',
    '하이퍼스케일', 'hyperscaler',
    'AI 수익', 'AI 매출', 'AI 의구심',
    '코파일럿', 'Copilot',
    'AI 투자', 'capex 우려'
  ],

  macro: [
    '연준', 'Fed', 'FOMC',
    '금리', '기준금리', '금리인상', '금리인하',
    '유가', '원유', 'WTI', '브렌트',
    'OPEC',
    '인플레이션', 'CPI', 'PPI',
    '환율', '달러',
    '백악관', 'Ratepayer Protection',
    'Burry', '버블', 'bubble',
    'Howard Marks',
    'GDP', '경기'
  ]
};

function detectCategory(headline, defaultCategory) {
  const scores = {};

  for (const [category, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    scores[category] = 0;
    for (const keyword of keywords) {
      if (headline.includes(keyword)) {
        scores[category]++;
      }
    }
  }

  let bestCategory = defaultCategory;
  let bestScore = 0;

  for (const [category, score] of Object.entries(scores)) {
    if (score > bestScore) {
      bestScore = score;
      bestCategory = category;
    }
  }

const finalCategory = bestScore > 0 ? bestCategory : defaultCategory;

  if (bestScore > 0 && finalCategory !== defaultCategory) {
    console.log(`🏷️ ${defaultCategory} → ${finalCategory}: ${headline.substring(0, 50)}`);
  }

  return finalCategory;
}

    async function fetchFromRSS(rssUrl, category, defaultIcon) {
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

  try {
    const response = await fetch(apiUrl);
    const data = await response.json();

    if (data.status !== 'ok') {
      console.error('RSS 가져오기 실패:', rssUrl);
      return [];
    }

  return data.items
  .filter(item => !isJunkNews(item.title))
  .slice(0, 10)
  .map(item => ({
    time: formatRSSTime(item.pubDate),
    category: detectCategory(item.title, category),
    icon: defaultIcon,
    headline: item.title,
    ticker: null,
    tickerType: null,
    link: item.link
  }));
  } catch (error) {
    console.error('RSS 에러:', error);
    return [];
  }
}

function formatRSSTime(pubDate) {
  const date = new Date(pubDate);
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${month}/${day} ${hours}:${minutes}`;
}

function getTimestamp(timeStr) {
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth() + 1;

  const [datePart, timePart] = timeStr.split(' ');
  const [month, day] = datePart.split('/').map(Number);
  const [hour, minute] = (timePart || '00:00').split(':').map(Number);

  let year = currentYear;
  if (month > currentMonth) {
    year = currentYear - 1;
  }

  return new Date(year, month - 1, day, hour, minute).getTime();
}

const RSS_SOURCES = [
  { url: 'https://news.google.com/rss/search?q=SK하이닉스&hl=ko', category: 'memory', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=삼성전자+HBM&hl=ko', category: 'memory', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=마이크론&hl=ko', category: 'memory', icon: '📄' },

  { url: 'https://news.google.com/rss/search?q=LS일렉트릭&hl=ko', category: 'power', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=HD현대일렉트릭&hl=ko', category: 'power', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=효성중공업&hl=ko', category: 'power', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=두산에너빌리티&hl=ko', category: 'power', icon: '📄' },

  { url: 'https://news.google.com/rss/search?q=NVIDIA+AI&hl=ko', category: 'bigtech', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=Microsoft+capex&hl=ko', category: 'bigtech', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=AI+데이터센터&hl=ko', category: 'bigtech', icon: '📄' },

  { url: 'https://news.google.com/rss/search?q=AI+광학+패키징&hl=ko', category: 'optic', icon: '📄' },
  { url: 'https://news.google.com/rss/search?q=TSMC+CoWoS&hl=ko', category: 'optic', icon: '📄' },

  { url: 'https://news.google.com/rss/search?q=연준+금리&hl=ko', category: 'macro', icon: '🏛️' },
  { url: 'https://news.google.com/rss/search?q=유가&hl=ko', category: 'macro', icon: '🏛️' }
];

async function loadNews() {
  try {
    const localResponse = await fetch('news.json');
    const localNews = await localResponse.json();

    const allRssNews = await Promise.all(
      RSS_SOURCES.map(source =>
        fetchFromRSS(source.url, source.category, source.icon)
      )
    );

    const flatRssNews = allRssNews.flat();

    const seen = new Set();
    const uniqueRssNews = flatRssNews.filter(item => {
      if (seen.has(item.headline)) return false;
      seen.add(item.headline);
      return true;
    });

    newsData = [...uniqueRssNews, ...localNews];

    newsData.sort((a, b) => getTimestamp(b.time) - getTimestamp(a.time));

    updateStats();
    renderNews();
    updateTimestamp();
  } catch (error) {
    console.error('뉴스 불러오기 실패:', error);
  }
}

    loadNews();
    setupFilters();
  </script>
</body>
