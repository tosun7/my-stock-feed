<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Stock Feed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1115;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      min-height: 100vh;
      padding: 16px;
    }

    .layout { max-width: 1800px; margin: 0 auto; }

    .channel-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; background: #1a1d24;
      border-radius: 12px; border: 1px solid #2a2d34;
      margin-bottom: 8px;
    }
    .channel-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: #2a4d8a; display: flex;
      align-items: center; justify-content: center;
      font-weight: 600; font-size: 13px; color: #fff;
      flex-shrink: 0;
    }
    .channel-info { flex: 1; min-width: 0; }
    .channel-name { font-size: 14px; font-weight: 600; color: #6da3e8; }
    .channel-desc { font-size: 11px; color: #8a8a8a; margin-top: 2px; }

    .time-boxes {
      display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap;
    }
    .time-box {
      background: #22252c;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      min-width: 100px;
    }
    .time-label {
      color: #6a6a6a;
      font-size: 9px;
      margin-bottom: 1px;
    }
    .time-value {
      color: #e0e0e0;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .market-box {
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      min-width: 110px;
    }
    .market-box.regular { background: #1f4d3a; color: #6dd49e; }
    .market-box.pre { background: #1a3050; color: #6da3e8; }
    .market-box.post { background: #2d1d40; color: #b794f4; }
    .market-box.closed { background: #2a2d34; color: #8a8a8a; }
    .market-status-label {
      font-size: 9px;
      opacity: 0.8;
      margin-bottom: 1px;
      display: flex; align-items: center; gap: 4px;
    }
    .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor;
    }
    .market-box.regular .status-dot { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .market-remaining {
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .nav-links { display: flex; gap: 6px; }
    .nav-link {
      padding: 6px 12px; border-radius: 8px;
      font-size: 12px; color: #b0b0b0;
      text-decoration: none; background: #2a2d34;
      transition: all 0.2s; white-space: nowrap;
    }
    .nav-link:hover { background: #3a3d44; color: #e0e0e0; }
    .nav-link.active { background: #2a4d8a; color: #fff; }

    .market-schedule {
      background: #1a1d24;
      border-radius: 8px;
      border: 1px solid #2a2d34;
      padding: 7px 14px;
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 11px;
      color: #8a8a8a;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .schedule-label { font-weight: 500; color: #b0b0b0; }
    .schedule-item { display: flex; align-items: center; gap: 4px; }
    .schedule-dot { width: 6px; height: 6px; border-radius: 50%; }
    .schedule-dot.pre { background: #6da3e8; }
    .schedule-dot.regular { background: #6dd49e; }
    .schedule-dot.post { background: #b794f4; }

    .main-grid {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 12px;
    }
    @media (max-width: 1100px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .main-area {
      background: #1a1d24;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      padding: 16px;
    }

    .main-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .main-title {
      font-size: 16px; font-weight: 600;
      color: #f0f0f0;
    }
    .main-actions { display: flex; gap: 8px; }
    .btn-primary {
      background: #2a4d8a; color: #fff;
      border: none; padding: 7px 14px;
      border-radius: 8px; font-size: 12px;
      cursor: pointer; font-weight: 500;
    }
    .btn-primary:hover { background: #3a5d9a; }

    .tag-filter-bar {
      background: #22252c;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .filter-label {
      font-size: 10px;
      color: #6a6a6a;
      margin-right: 4px;
      font-weight: 500;
    }
    .filter-btn {
      font-size: 12px;
      padding: 5px 12px;
      background: #2a2d34;
      color: #b0b0b0;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .filter-btn:hover {
      background: #3a3d44;
      color: #e0e0e0;
    }
    .filter-btn.active {
      background: #2a4d8a;
      color: #fff;
      font-weight: 500;
    }
    .filter-btn.no-tag {
      opacity: 0.7;
      font-style: italic;
    }
    .filter-btn .count {
      opacity: 0.7;
      margin-left: 2px;
    }

    .stocks-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(6, 1fr);
    }
    @media (max-width: 1500px) { .stocks-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1200px) { .stocks-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) { .stocks-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px) { .stocks-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .stocks-grid { grid-template-columns: 1fr; } }

    .stock-card {
      background: #22252c;
      border: 1px solid #2a2d34;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      min-width: 0;
    }
    .stock-card:hover {
      background: #2a2d34;
      border-color: #3a4d6c;
      transform: translateY(-1px);
    }

    .card-top {
      display: flex; justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      min-width: 0;
    }
    .card-symbol-area { min-width: 0; flex: 1; }
    .card-symbol {
      font-size: 13px; font-weight: 600;
      color: #e0e0e0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-name {
      font-size: 9px; color: #8a8a8a;
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .card-btn {
      background: transparent; border: none;
      color: #6a6a6a; cursor: pointer;
      padding: 1px 3px; font-size: 11px;
      border-radius: 4px; line-height: 1;
    }
    .card-btn:hover { background: #2a2d34; color: #e0e0e0; }
    .card-btn.delete:hover { background: #5c2a2a; color: #e88a8a; }

    .card-price {
      font-size: 17px; font-weight: 600;
      line-height: 1.1;
    }
    .price-up { color: #6dd49e; }
    .price-down { color: #e88a8a; }
    .price-flat { color: #c0c0c0; }
    .price-loading {
      font-size: 11px; color: #6a6a6a;
      font-style: italic;
    }

    .card-changes {
      display: flex; gap: 6px;
      font-size: 10px;
      margin-top: 2px;
    }
    .change-label { color: #6a6a6a; margin-right: 1px; }

    .card-after-hours {
      margin-top: 3px;
      font-size: 9px;
      color: #8a8a8a;
      display: flex; gap: 4px; align-items: center;
    }
    .after-hours-label {
      padding: 1px 4px;
      background: #2a3d5c;
      color: #6da3e8;
      border-radius: 3px;
      font-weight: 500;
      font-size: 8px;
    }

    .card-chart {
      height: 24px;
      margin: 6px 0;
      width: 100%;
    }
    .card-chart svg { width: 100%; height: 100%; }

    .card-bottom {
      padding-top: 6px;
      border-top: 1px solid #2a2d34;
    }
    .card-meta {
      display: flex; justify-content: space-between;
      font-size: 9px; color: #8a8a8a;
      margin-bottom: 4px;
    }
    .card-tags {
      display: flex; flex-wrap: wrap; gap: 2px;
    }
    .tag {
      font-size: 8px;
      padding: 1px 5px;
      background: #1a2d40;
      color: #6da3e8;
      border-radius: 6px;
      font-weight: 500;
    }
    .tag-empty {
      font-size: 8px;
      color: #6a6a6a;
      font-style: italic;
      padding: 1px 2px;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #6a6a6a;
      font-size: 13px;
    }
    .no-results .small {
      font-size: 11px;
      color: #6a6a6a;
      margin-top: 6px;
    }

    .sidebar { display: flex; flex-direction: column; gap: 12px; }
    .sidebar-box {
      background: #1a1d24; border-radius: 12px;
      border: 1px solid #2a2d34; padding: 14px 16px;
    }
    .sidebar-title {
      font-size: 13px; font-weight: 600;
      color: #f0f0f0; margin-bottom: 10px;
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .add-btn-small {
      background: #2a4d8a; color: #fff;
      border: none; padding: 3px 8px;
      border-radius: 10px; font-size: 10px;
      cursor: pointer; font-weight: 500;
    }
    .add-btn-small:hover { background: #3a5d9a; }

    .news-list-sidebar { max-height: 600px; overflow-y: auto; }
    .news-item-mini {
      padding: 6px 0;
      border-bottom: 1px solid #2a2d34;
      cursor: pointer;
    }
    .news-item-mini:last-child { border-bottom: none; }
    .news-item-mini:hover { background: #22252c; }
    .news-mini-time {
      font-size: 10px; color: #6a6a6a;
      margin-bottom: 2px;
      display: flex; align-items: center; gap: 4px;
    }
    .news-ticker {
      padding: 1px 5px;
      background: #1a2d40;
      color: #6da3e8;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
    }
    .news-ticker.macro {
      background: #2d1d40;
      color: #b794f4;
    }
    .news-mini-headline {
      font-size: 11px; color: #c0c0c0;
      line-height: 1.4;
    }

    .calendar-item {
      padding: 6px 0; font-size: 12px;
      border-bottom: 1px solid #2a2d34;
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .calendar-item:last-child { border-bottom: none; }
    .calendar-content { flex: 1; min-width: 0; }
    .calendar-date { color: #6da3e8; font-weight: 500; font-size: 11px; }
    .calendar-event { color: #e0e0e0; margin-top: 2px; font-size: 11px; }
    .delete-btn-mini {
      background: transparent; color: #6a6a6a;
      border: none; cursor: pointer; font-size: 12px;
      padding: 2px 4px; border-radius: 4px;
    }
    .delete-btn-mini:hover { background: #5c2a2a; color: #e88a8a; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #1a1d24;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      padding: 24px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 16px; font-weight: 600;
      color: #f0f0f0; margin-bottom: 16px;
    }
    .modal-input {
      width: 100%; padding: 8px 12px;
      background: #22252c; border: 1px solid #2a2d34;
      border-radius: 6px; color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .modal-input::placeholder { color: #6a6a6a; }
    .modal-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .modal-label {
      font-size: 11px; color: #8a8a8a;
      margin: 8px 0 4px;
    }
    .modal-actions {
      display: flex; gap: 8px;
      margin-top: 16px;
    }
    .modal-actions button {
      flex: 1; padding: 8px;
      border-radius: 6px; border: none;
      font-size: 12px; cursor: pointer;
      font-weight: 500;
    }

    .tags-input-area {
      display: flex; flex-wrap: wrap;
      gap: 4px;
      padding: 6px;
      background: #22252c;
      border: 1px solid #2a2d34;
      border-radius: 6px;
      min-height: 38px;
    }
    .tag-chip {
      font-size: 11px;
      padding: 3px 8px;
      background: #1a2d40;
      color: #6da3e8;
      border-radius: 10px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag-remove {
      background: transparent;
      border: none;
      color: #6da3e8;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }
    .tag-input-field {
      flex: 1; min-width: 100px;
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
      padding: 3px;
    }

    .quick-add-modal {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 6px;
    }
    .quick-chip {
      font-size: 10px; padding: 3px 8px;
      background: #2a2d34; color: #b0b0b0;
      border-radius: 10px; cursor: pointer; border: none;
    }
    .quick-chip:hover { background: #3a3d44; }

    .footer {
      background: #1a1d24; padding: 14px 16px;
      border-radius: 12px; border: 1px solid #2a2d34;
      margin-top: 12px; text-align: center;
      font-size: 12px; color: #6a6a6a;
    }

    .placeholder-msg {
      font-size: 11px; color: #6a6a6a;
      text-align: center; padding: 16px 8px;
      font-style: italic;
    }

    .event-form {
      display: none; flex-direction: column;
      gap: 6px; margin-top: 8px;
      padding: 10px; background: #22252c;
      border-radius: 8px;
    }
    .event-form.show { display: flex; }
    .event-form input {
      width: 100%; padding: 6px 10px;
      background: #1a1d24; border: 1px solid #2a2d34;
      border-radius: 6px; color: #e0e0e0; font-size: 11px;
    }
    .event-form input::placeholder { color: #6a6a6a; }
    .event-actions { display: flex; gap: 6px; }
    .event-actions button {
      flex: 1; padding: 5px 8px;
      border-radius: 6px; border: none;
      font-size: 11px; cursor: pointer;
    }
    .btn-confirm { background: #2a4d8a; color: #fff; }
    .btn-cancel { background: #2a2d34; color: #b0b0b0; }
  </style>
</head>
<body>
  <div class="layout">

    <div class="channel-header">
      <div class="channel-avatar">VB</div>
      <div class="channel-info">
        <div class="channel-name">MY STOCK FEED</div>
        <div class="channel-desc">미국 주식 포트폴리오 모니터</div>
      </div>

      <div class="time-boxes">
        <div class="time-box">
          <div class="time-label">🇺🇸 미국 동부</div>
          <div class="time-value" id="us-time">--:--</div>
        </div>
        <div class="time-box">
          <div class="time-label">🇰🇷 한국</div>
          <div class="time-value" id="kr-time">--:--</div>
        </div>
        <div class="market-box closed" id="market-box">
          <div class="market-status-label">
            <span class="status-dot"></span>
            <span id="market-name">확인 중...</span>
          </div>
          <div class="market-remaining" id="market-remaining">--:--</div>
        </div>
        <div class="nav-links">
          <a href="index.html" class="nav-link active">📊 포트폴리오</a>
          <a href="portfolios.html" class="nav-link">🏢 빅테크</a>
        </div>
      </div>
    </div>

    <div class="market-schedule">
      <span class="schedule-label">미국 장 시간 (한국 시간 기준)</span>
      <span class="schedule-item">
        <span class="schedule-dot pre"></span>
        프리장 <span id="pre-times">17:00~22:30</span>
      </span>
      <span class="schedule-item">
        <span class="schedule-dot regular"></span>
        정규장 <span id="regular-times">22:30~05:00</span>
      </span>
      <span class="schedule-item">
        <span class="schedule-dot post"></span>
        시간외 <span id="post-times">05:00~09:00</span>
      </span>
    </div>

    <div class="main-grid">

      <div class="main-area">
        <div class="main-header">
          <div class="main-title">📊 관심 종목 (<span id="stock-count">0</span>)</div>
          <div class="main-actions">
            <button class="btn-primary" id="add-stock-btn">+ 종목 추가</button>
          </div>
        </div>

        <div class="tag-filter-bar" id="tag-filter-bar">
          <span class="filter-label">필터:</span>
        </div>

        <div class="stocks-grid" id="stocks-grid"></div>
      </div>

      <div class="sidebar">

        <div class="sidebar-box">
          <div class="sidebar-title">
            <span>📰 관심 종목 뉴스</span>
            <span id="news-count" style="font-size: 11px; color: #8a8a8a; font-weight: 400;"></span>
          </div>
          <div class="news-list-sidebar" id="news-list"></div>
        </div>

        <div class="sidebar-box">
          <div class="sidebar-title">
            <span>📅 다가오는 이벤트</span>
            <button class="add-btn-small" id="toggle-event-btn">+</button>
          </div>

          <div id="event-list"></div>

          <div class="event-form" id="event-form">
            <input type="text" id="event-date" placeholder="날짜 (예: 5/27 (화))">
            <input type="text" id="event-name" placeholder="이벤트명">
            <div class="event-actions">
              <button class="btn-confirm" id="confirm-event">추가</button>
              <button class="btn-cancel" id="cancel-event">취소</button>
            </div>
          </div>
        </div>

        <div class="sidebar-box">
          <div class="sidebar-title">📱 텔레그램</div>
          <div class="placeholder-msg">추후 추가 예정</div>
        </div>

      </div>
    </div>

    <div class="footer">
      마지막 업데이트: <span id="last-update">-</span>
    </div>
  </div>

  <div class="modal-overlay" id="stock-modal">
    <div class="modal">
      <div class="modal-title" id="modal-title">종목 추가</div>

      <div class="modal-label">종목 코드 (예: NASDAQ:NVDA)</div>
      <input type="text" class="modal-input" id="modal-symbol" placeholder="NASDAQ:NVDA">

      <div class="modal-label">회사명</div>
      <input type="text" class="modal-input" id="modal-name" placeholder="NVIDIA">

      <div class="modal-label">태그 (엔터 또는 콤마로 구분)</div>
      <div class="tags-input-area" id="tags-area">
        <input type="text" class="tag-input-field" id="tag-input" placeholder="태그 입력...">
      </div>

      <div class="modal-label">빠른 종목 추가:</div>
      <div class="quick-add-modal">
        <button class="quick-chip" data-symbol="NASDAQ:NVDA" data-name="NVIDIA">NVDA</button>
        <button class="quick-chip" data-symbol="NASDAQ:MSFT" data-name="Microsoft">MSFT</button>
        <button class="quick-chip" data-symbol="NASDAQ:GOOGL" data-name="Alphabet">GOOGL</button>
        <button class="quick-chip" data-symbol="NASDAQ:META" data-name="Meta">META</button>
        <button class="quick-chip" data-symbol="NASDAQ:AMZN" data-name="Amazon">AMZN</button>
        <button class="quick-chip" data-symbol="NYSE:GEV" data-name="GE Vernova">GEV</button>
        <button class="quick-chip" data-symbol="NYSE:ETN" data-name="Eaton">ETN</button>
        <button class="quick-chip" data-symbol="NYSE:TSM" data-name="TSMC">TSM</button>
        <button class="quick-chip" data-symbol="NASDAQ:MU" data-name="Micron">MU</button>
        <button class="quick-chip" data-symbol="NYSE:PWR" data-name="Quanta">PWR</button>
        <button class="quick-chip" data-symbol="NASDAQ:AVGO" data-name="Broadcom">AVGO</button>
      </div>

      <div class="modal-actions">
        <button class="btn-confirm" id="modal-save">저장</button>
        <button class="btn-cancel" id="modal-cancel">취소</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================
       한글명 사전 (티커 → 한글 회사명)
       ============================================ */
    const KOREAN_NAMES = {
      'NVDA': ['엔비디아'],
      'MSFT': ['마이크로소프트'],
      'GOOGL': ['알파벳', '구글'],
      'GOOG': ['알파벳', '구글'],
      'META': ['메타'],
      'AMZN': ['아마존'],
      'AAPL': ['애플'],
      'TSLA': ['테슬라'],
      'GEV': ['GE 버노바', 'GE 베르노바'],
      'ETN': ['이튼'],
      'TSM': ['TSMC', '대만 반도체'],
      'MU': ['마이크론'],
      'DELL': ['델 테크놀로지스'],
      'PWR': ['콴타'],
      'AVGO': ['브로드컴'],
      'AMD': ['AMD'],
      'PLTR': ['팔란티어'],
      'COHR': ['코히어런트'],
      'LRCX': ['램리서치'],
      'KLAC': ['KLA'],
      'AMAT': ['어플라이드 머티리얼즈'],
      'VRT': ['버티브'],
      'CRWD': ['크라우드스트라이크'],
      'ORCL': ['오라클'],
      'IBM': ['IBM'],
      'INTC': ['인텔'],
      'NFLX': ['넷플릭스'],
      'DIS': ['디즈니'],
      'JPM': ['JP모건'],
      'BAC': ['뱅크오브아메리카'],
      'XOM': ['엑손모빌'],
      'CCJ': ['카메코']
    };

    function getKoreanNames(ticker) {
      return KOREAN_NAMES[ticker] || [];
    }

    /* 미국 시간 + 장 상태 */
    function getUSEasternTime() {
      const now = new Date();
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false, timeZoneName: 'short'
      });
      const parts = formatter.formatToParts(now);
      const get = (type) => parts.find(p => p.type === type)?.value;
      return {
        year: parseInt(get('year')),
        month: parseInt(get('month')),
        day: parseInt(get('day')),
        hour: parseInt(get('hour')) % 24,
        minute: parseInt(get('minute')),
        tzName: get('timeZoneName')
      };
    }

    function getKoreaTime() {
      const now = new Date();
      const formatter = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
      return formatter.format(now);
    }

    function getMarketStatus() {
      const us = getUSEasternTime();
      const usDate = new Date(Date.UTC(us.year, us.month - 1, us.day));
      const dayOfWeek = usDate.getUTCDay();

      if (dayOfWeek === 0 || dayOfWeek === 6) {
        return { status: 'closed', name: '주말 (마감)', remaining: '월요일' };
      }

      const totalMinutes = us.hour * 60 + us.minute;
      const preMarketStart = 4 * 60;
      const regularStart = 9 * 60 + 30;
      const regularEnd = 16 * 60;
      const postMarketEnd = 20 * 60;

      let status, name, endMinutes;
      if (totalMinutes < preMarketStart) {
        status = 'closed'; name = '장 마감'; endMinutes = preMarketStart;
      } else if (totalMinutes < regularStart) {
        status = 'pre'; name = '프리장'; endMinutes = regularStart;
      } else if (totalMinutes < regularEnd) {
        status = 'regular'; name = '정규장'; endMinutes = regularEnd;
      } else if (totalMinutes < postMarketEnd) {
        status = 'post'; name = '시간외'; endMinutes = postMarketEnd;
      } else {
        status = 'closed'; name = '장 마감';
        endMinutes = (24 * 60) + preMarketStart;
      }

      const remainingMinutes = endMinutes - totalMinutes;
      const hours = Math.floor(remainingMinutes / 60);
      const minutes = remainingMinutes % 60;
      let remaining;
      if (status === 'closed' && remainingMinutes >= 8 * 60) {
        remaining = '다음 장 대기';
      } else {
        remaining = `${hours}:${String(minutes).padStart(2, '0')} 남음`;
      }
      return { status, name, remaining, tzName: us.tzName };
    }

    function renderTimeAndMarket() {
      const us = getUSEasternTime();
      const krTime = getKoreaTime();
      const market = getMarketStatus();

      const usHour = String(us.hour).padStart(2, '0');
      const usMin = String(us.minute).padStart(2, '0');
      document.getElementById('us-time').textContent = `${usHour}:${usMin} ${us.tzName}`;
      document.getElementById('kr-time').textContent = krTime;

      const box = document.getElementById('market-box');
      box.className = `market-box ${market.status}`;
      document.getElementById('market-name').textContent = market.name;
      document.getElementById('market-remaining').textContent = market.remaining;

      const isEDT = us.tzName === 'EDT';
      const offsetHours = isEDT ? 13 : 14;
      const toKRTime = (usHour, usMin) => {
        let h = (usHour + offsetHours) % 24;
        return `${String(h).padStart(2, '0')}:${String(usMin).padStart(2, '0')}`;
      };
      document.getElementById('pre-times').textContent = `${toKRTime(4, 0)}~${toKRTime(9, 30)}`;
      document.getElementById('regular-times').textContent = `${toKRTime(9, 30)}~${toKRTime(16, 0)}`;
      document.getElementById('post-times').textContent = `${toKRTime(16, 0)}~${toKRTime(20, 0)}`;
    }

    /* 관심 종목 */
    const DEFAULT_WATCHLIST = [
      { symbol: 'NASDAQ:NVDA', name: 'NVIDIA', tags: [] },
      { symbol: 'NASDAQ:MSFT', name: 'Microsoft', tags: [] },
      { symbol: 'NASDAQ:GOOGL', name: 'Alphabet', tags: [] },
      { symbol: 'NASDAQ:META', name: 'Meta', tags: [] },
      { symbol: 'NASDAQ:AMZN', name: 'Amazon', tags: [] },
      { symbol: 'NYSE:GEV', name: 'GE Vernova', tags: [] },
      { symbol: 'NYSE:ETN', name: 'Eaton', tags: [] },
      { symbol: 'NYSE:TSM', name: 'TSMC', tags: [] },
      { symbol: 'NASDAQ:MU', name: 'Micron', tags: [] }
    ];

    function loadWatchlist() {
      const saved = localStorage.getItem('myWatchlist');
      if (saved) {
        try {
          const list = JSON.parse(saved);
          return list.map(item => ({
            ...item,
            tags: item.tags || []
          })).filter(item =>
            !item.symbol.startsWith('KRX:') &&
            !item.symbol.startsWith('KOSDAQ:')
          );
        }
        catch (e) { console.error('관심 종목 로드 실패:', e); }
      }
      return [...DEFAULT_WATCHLIST];
    }

    function saveWatchlist(list) {
      localStorage.setItem('myWatchlist', JSON.stringify(list));
    }

    let watchlist = loadWatchlist();
    saveWatchlist(watchlist);

    /* 현재 활성 필터 */
    let currentFilter = 'all';

    function collectAllTags() {
      const tagCounts = {};
      let noTagCount = 0;

      watchlist.forEach(item => {
        if (!item.tags || item.tags.length === 0) {
          noTagCount++;
        } else {
          item.tags.forEach(tag => {
            tagCounts[tag] = (tagCounts[tag] || 0) + 1;
          });
        }
      });

      const sortedTags = Object.entries(tagCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([tag, count]) => ({ tag, count }));

      return { tags: sortedTags, noTagCount };
    }

    function renderFilterBar() {
      const { tags, noTagCount } = collectAllTags();
      const container = document.getElementById('tag-filter-bar');

      let html = '<span class="filter-label">필터:</span>';

      html += `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">
        전체 <span class="count">(${watchlist.length})</span>
      </button>`;

      tags.forEach(({ tag, count }) => {
        const isActive = currentFilter === tag;
        html += `<button class="filter-btn ${isActive ? 'active' : ''}" data-filter="${tag}">
          ${tag} <span class="count">(${count})</span>
        </button>`;
      });

      if (noTagCount > 0) {
        const isActive = currentFilter === '__no_tag__';
        html += `<button class="filter-btn no-tag ${isActive ? 'active' : ''}" data-filter="__no_tag__">
          태그 없음 <span class="count">(${noTagCount})</span>
        </button>`;
      }

      container.innerHTML = html;

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.dataset.filter;
          renderFilterBar();
          renderWatchlist();
        });
      });
    }

    function getFilteredWatchlist() {
      if (currentFilter === 'all') {
        return watchlist.map((item, idx) => ({ item, idx }));
      }
      if (currentFilter === '__no_tag__') {
        return watchlist
          .map((item, idx) => ({ item, idx }))
          .filter(({ item }) => !item.tags || item.tags.length === 0);
      }
      return watchlist
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => item.tags && item.tags.includes(currentFilter));
    }

    async function fetchUSPriceWithChart(symbol) {
      const ticker = symbol.split(':')[1];
      const apiUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=5d&includePrePost=true`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

      try {
        const response = await fetch(proxyUrl);
        const data = await response.json();
        const yahooData = JSON.parse(data.contents);

        const result = yahooData.chart?.result?.[0];
        if (!result) return null;

        const meta = result.meta;
        const prices = result.indicators?.quote?.[0]?.close || [];
        const cleanPrices = prices.filter(p => p !== null && p !== undefined);

        if (cleanPrices.length === 0) return null;

        const currentPrice = meta.regularMarketPrice;
        const previousClose = meta.previousClose || meta.chartPreviousClose;
        const dayChange = currentPrice - previousClose;
        const dayChangePercent = (dayChange / previousClose) * 100;

        const weekAgoPrice = cleanPrices[0];
        const weekChangePercent = ((currentPrice - weekAgoPrice) / weekAgoPrice) * 100;

        let postMarketPrice = null;
        let postMarketChangePercent = null;
        if (meta.postMarketPrice && meta.postMarketPrice !== currentPrice) {
          postMarketPrice = meta.postMarketPrice;
          const postChange = postMarketPrice - currentPrice;
          postMarketChangePercent = (postChange / currentPrice) * 100;
        }

        return {
          price: currentPrice.toFixed(2),
          dayChangePercent: dayChangePercent.toFixed(2),
          weekChangePercent: weekChangePercent.toFixed(2),
          prices: cleanPrices,
          marketCap: meta.marketCap || null,
          postMarketPrice: postMarketPrice ? postMarketPrice.toFixed(2) : null,
          postMarketChangePercent: postMarketChangePercent !== null ? postMarketChangePercent.toFixed(2) : null
        };
      } catch (error) {
        console.error('가격 가져오기 실패:', symbol, error);
        return null;
      }
    }

    function formatMarketCap(value) {
      if (!value) return '-';
      if (value >= 1e12) return `$${(value / 1e12).toFixed(1)}T`;
      if (value >= 1e9) return `$${(value / 1e9).toFixed(0)}B`;
      if (value >= 1e6) return `$${(value / 1e6).toFixed(0)}M`;
      return `$${value}`;
    }

    function renderMiniChart(prices, isUp) {
      if (!prices || prices.length < 2) return '';

      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min || 1;

      const points = prices.map((p, i) => {
        const x = (i / (prices.length - 1)) * 100;
        const y = 24 - ((p - min) / range) * 20 - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const color = isUp ? '#6dd49e' : '#e88a8a';
      const fillColor = isUp ? 'rgba(109,212,158,0.15)' : 'rgba(232,138,138,0.15)';
      const areaPoints = `0,24 ${points} 100,24`;

      return `
        <svg viewBox="0 0 100 24" preserveAspectRatio="none">
          <polyline fill="${fillColor}" stroke="none" points="${areaPoints}" />
          <polyline fill="none" stroke="${color}" stroke-width="1.5" points="${points}" />
        </svg>
      `;
    }

    function renderStockCard(item, idx) {
      const tagsHtml = item.tags && item.tags.length > 0
        ? item.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('') +
          (item.tags.length > 3 ? `<span class="tag-empty">+${item.tags.length - 3}</span>` : '')
        : '<span class="tag-empty">태그 없음</span>';

      return `
        <div class="stock-card" data-idx="${idx}" data-symbol="${item.symbol}">
          <div class="card-top">
            <div class="card-symbol-area">
              <div class="card-symbol">${item.symbol.split(':')[1]}</div>
              <div class="card-name">${item.name}</div>
            </div>
            <div class="card-actions">
              <button class="card-btn tag-edit" data-idx="${idx}" title="편집">✏️</button>
              <button class="card-btn delete" data-idx="${idx}" title="삭제">🗑️</button>
            </div>
          </div>

          <div class="card-price price-loading" id="price-${idx}">로딩...</div>
          <div class="card-changes" id="changes-${idx}"></div>
          <div id="after-hours-${idx}"></div>
          <div class="card-chart" id="chart-${idx}"></div>

          <div class="card-bottom">
            <div class="card-meta" id="meta-${idx}">
              <span>-</span>
            </div>
            <div class="card-tags">${tagsHtml}</div>
          </div>
        </div>
      `;
    }

    function renderWatchlist() {
      const container = document.getElementById('stocks-grid');
      document.getElementById('stock-count').textContent = watchlist.length;

      if (watchlist.length === 0) {
        container.innerHTML = '<div class="no-results">관심 종목이 없습니다.<br><span class="small">"+ 종목 추가" 버튼을 눌러주세요.</span></div>';
        return;
      }

      const filtered = getFilteredWatchlist();

      if (filtered.length === 0) {
        const filterText = currentFilter === '__no_tag__' ? '태그 없는 종목' : `"${currentFilter}"`;
        container.innerHTML = `<div class="no-results">${filterText} 종목이 없습니다.<br><span class="small">다른 필터를 선택하거나 카드 ✏️ 버튼으로 태그를 추가하세요.</span></div>`;
        return;
      }

      container.innerHTML = filtered.map(({ item, idx }) => renderStockCard(item, idx)).join('');

      container.querySelectorAll('.stock-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          const symbol = card.dataset.symbol;
          const ticker = symbol.split(':')[1];
          window.location.href = `stock.html?ticker=${ticker}`;
        });
      });

      container.querySelectorAll('.tag-edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx);
          openEditModal(idx);
        });
      });

      container.querySelectorAll('.delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx);
          if (confirm(`${watchlist[idx].name} 삭제하시겠어요?`)) {
            watchlist.splice(idx, 1);
            saveWatchlist(watchlist);
            renderFilterBar();
            renderWatchlist();
            loadAllUSPrices();
            loadNews();  // 종목 삭제 시 뉴스도 갱신
          }
        });
      });
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function loadAllUSPrices() {
      const visible = getFilteredWatchlist();

      for (const { item, idx } of visible) {
        const priceEl = document.getElementById(`price-${idx}`);
        const changesEl = document.getElementById(`changes-${idx}`);
        const chartEl = document.getElementById(`chart-${idx}`);
        const metaEl = document.getElementById(`meta-${idx}`);
        const afterHoursEl = document.getElementById(`after-hours-${idx}`);

        if (!priceEl) continue;

        let data = await fetchUSPriceWithChart(item.symbol);
        if (!data) { await sleep(500); data = await fetchUSPriceWithChart(item.symbol); }

        if (!data) {
          priceEl.innerHTML = '<span class="price-loading">데이터 없음</span>';
          await sleep(200);
          continue;
        }

        const dPct = parseFloat(data.dayChangePercent);
        const wPct = parseFloat(data.weekChangePercent);
        const isUp = dPct >= 0;
        const isDown = dPct < 0;

        const colorClass = isUp ? 'price-up' : isDown ? 'price-down' : 'price-flat';

        priceEl.className = `card-price ${colorClass}`;
        priceEl.textContent = `$${data.price}`;

        const dSign = dPct >= 0 ? '+' : '';
        const wSign = wPct >= 0 ? '+' : '';
        const dColor = dPct >= 0 ? 'price-up' : 'price-down';
        const wColor = wPct >= 0 ? 'price-up' : 'price-down';

        changesEl.innerHTML = `
          <span><span class="change-label">D</span><span class="${dColor}">${dSign}${data.dayChangePercent}%</span></span>
          <span><span class="change-label">W</span><span class="${wColor}">${wSign}${data.weekChangePercent}%</span></span>
        `;

        if (data.postMarketPrice && data.postMarketChangePercent !== null) {
          const pPct = parseFloat(data.postMarketChangePercent);
          const pSign = pPct >= 0 ? '+' : '';
          const pColor = pPct >= 0 ? 'price-up' : 'price-down';

          afterHoursEl.innerHTML = `
            <div class="card-after-hours">
              <span class="after-hours-label">시간외</span>
              <span class="${pColor}">$${data.postMarketPrice}</span>
              <span class="${pColor}">${pSign}${data.postMarketChangePercent}%</span>
            </div>
          `;
        } else {
          afterHoursEl.innerHTML = '';
        }

        chartEl.innerHTML = renderMiniChart(data.prices, isUp);
        metaEl.innerHTML = `<span>시총 ${formatMarketCap(data.marketCap)}</span>`;

        await sleep(200);
      }
    }

    /* 모달 */
    let editingIndex = -1;
    let currentTags = [];

    function openAddModal() {
      editingIndex = -1;
      currentTags = [];
      document.getElementById('modal-title').textContent = '종목 추가';
      document.getElementById('modal-symbol').value = '';
      document.getElementById('modal-name').value = '';
      document.getElementById('modal-symbol').disabled = false;
      renderTagsInModal();
      document.getElementById('stock-modal').classList.add('show');
      document.getElementById('modal-symbol').focus();
    }

    function openEditModal(idx) {
      editingIndex = idx;
      const item = watchlist[idx];
      currentTags = [...(item.tags || [])];
      document.getElementById('modal-title').textContent = `${item.name} 편집`;
      document.getElementById('modal-symbol').value = item.symbol;
      document.getElementById('modal-name').value = item.name;
      document.getElementById('modal-symbol').disabled = true;
      renderTagsInModal();
      document.getElementById('stock-modal').classList.add('show');
      document.getElementById('tag-input').focus();
    }

    function closeModal() {
      document.getElementById('stock-modal').classList.remove('show');
    }

    function renderTagsInModal() {
      const area = document.getElementById('tags-area');
      const input = document.getElementById('tag-input');
      area.querySelectorAll('.tag-chip').forEach(c => c.remove());

      currentTags.forEach((tag, i) => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `${tag}<button class="tag-remove" data-i="${i}">×</button>`;
        area.insertBefore(chip, input);
      });

      area.querySelectorAll('.tag-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const i = parseInt(btn.dataset.i);
          currentTags.splice(i, 1);
          renderTagsInModal();
        });
      });
    }

    function addTag(text) {
      if (!text) return;
      const parts = text.split(',');
      parts.forEach(part => {
        const trimmed = part.trim();
        if (!trimmed) return;
        if (currentTags.includes(trimmed)) return;
        currentTags.push(trimmed);
      });
      renderTagsInModal();
    }

    function setupModal() {
      const tagInput = document.getElementById('tag-input');
      const saveBtn = document.getElementById('modal-save');
      const cancelBtn = document.getElementById('modal-cancel');

      tagInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          addTag(tagInput.value);
          tagInput.value = '';
        } else if (e.key === 'Backspace' && tagInput.value === '' && currentTags.length > 0) {
          currentTags.pop();
          renderTagsInModal();
        }
      });

      tagInput.addEventListener('blur', () => {
        if (tagInput.value.trim()) {
          addTag(tagInput.value);
          tagInput.value = '';
        }
      });

      document.querySelectorAll('#stock-modal .quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.getElementById('modal-symbol').value = chip.dataset.symbol;
          document.getElementById('modal-name').value = chip.dataset.name;
          document.getElementById('modal-symbol').disabled = false;
        });
      });

      saveBtn.addEventListener('click', () => {
        const symbol = document.getElementById('modal-symbol').value.trim();
        const name = document.getElementById('modal-name').value.trim();

        if (!symbol || !name) { alert('종목 코드와 회사명을 모두 입력해주세요.'); return; }
        if (!symbol.includes(':')) { alert('형식: 거래소:티커 (예: NASDAQ:NVDA)'); return; }
        if (symbol.startsWith('KRX:') || symbol.startsWith('KOSDAQ:')) {
          alert('한국 주식은 추가할 수 없습니다.'); return;
        }

        const tagInputVal = document.getElementById('tag-input').value.trim();
        if (tagInputVal) addTag(tagInputVal);

        if (editingIndex >= 0) {
          watchlist[editingIndex].name = name;
          watchlist[editingIndex].tags = [...currentTags];
        } else {
          if (watchlist.some(item => item.symbol === symbol)) {
            alert('이미 추가된 종목입니다.'); return;
          }
          watchlist.push({ symbol, name, tags: [...currentTags] });
        }

        saveWatchlist(watchlist);
        closeModal();
        renderFilterBar();
        renderWatchlist();
        loadAllUSPrices();
        loadNews();  // 종목 추가/편집 시 뉴스도 갱신
      });

      cancelBtn.addEventListener('click', closeModal);

      document.getElementById('stock-modal').addEventListener('click', (e) => {
        if (e.target.id === 'stock-modal') closeModal();
      });

      document.getElementById('add-stock-btn').addEventListener('click', openAddModal);
    }

    /* 이벤트 */
    const DEFAULT_EVENTS = [
      { date: "5/27 (화)", event: "엔비디아 1Q26 실적" },
      { date: "6/4 (수)", event: "FOMC 금리 결정" },
      { date: "7/22-25", event: "빅테크 2Q 실적 시작" },
      { date: "8월 중", event: "잭슨홀 미팅" }
    ];

    function loadEvents() {
      const saved = localStorage.getItem('myEvents');
      if (saved) {
        try { return JSON.parse(saved); }
        catch (e) { console.error('이벤트 로드 실패:', e); }
      }
      const defaults = [...DEFAULT_EVENTS];
      localStorage.setItem('myEvents', JSON.stringify(defaults));
      return defaults;
    }

    function saveEvents(list) {
      localStorage.setItem('myEvents', JSON.stringify(list));
    }

    let events = loadEvents();

    function renderEvents() {
      const container = document.getElementById('event-list');

      if (events.length === 0) {
        container.innerHTML = '<div class="placeholder-msg">이벤트를 추가해보세요</div>';
        return;
      }

      container.innerHTML = events.map((item, idx) => `
        <div class="calendar-item">
          <div class="calendar-content">
            <div class="calendar-date">${item.date}</div>
            <div class="calendar-event">${item.event}</div>
          </div>
          <button class="delete-btn-mini" data-idx="${idx}">🗑️</button>
        </div>
      `).join('');

      container.querySelectorAll('.delete-btn-mini').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          if (confirm('이 이벤트를 삭제하시겠습니까?')) {
            events.splice(idx, 1);
            saveEvents(events);
            renderEvents();
          }
        });
      });
    }

    function setupEventForm() {
      const toggleBtn = document.getElementById('toggle-event-btn');
      const eventForm = document.getElementById('event-form');
      const dateInput = document.getElementById('event-date');
      const nameInput = document.getElementById('event-name');
      const confirmBtn = document.getElementById('confirm-event');
      const cancelBtn = document.getElementById('cancel-event');

      toggleBtn.addEventListener('click', () => {
        eventForm.classList.toggle('show');
        if (eventForm.classList.contains('show')) dateInput.focus();
      });

      confirmBtn.addEventListener('click', () => {
        const date = dateInput.value.trim();
        const name = nameInput.value.trim();
        if (!date || !name) { alert('날짜와 이벤트명을 모두 입력해주세요.'); return; }
        events.push({ date, event: name });
        saveEvents(events);
        renderEvents();
        dateInput.value = '';
        nameInput.value = '';
        eventForm.classList.remove('show');
      });

      cancelBtn.addEventListener('click', () => {
        dateInput.value = '';
        nameInput.value = '';
        eventForm.classList.remove('show');
      });

      [dateInput, nameInput].forEach(input => {
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') confirmBtn.click();
        });
      });
    }

    /* ============================================
       뉴스 - 관심 종목 기반 동적 생성
       ============================================ */
    let newsData = [];

    function isJunkNews(headline) {
      if (!headline || headline.length < 10) return true;
      const blacklist = [
        '리딩방', '무료 리딩', '매수 추천', 'TOP 5',
        '100% 수익', '대박 종목', '특급 정보',
        '★', '☆', '◆', '◇', '■', '□',
        'Best Stocks to Buy', 'Strong Buy', 'Motley Fool', 'Zacks Rank'
      ];
      for (const word of blacklist) {
        if (headline.includes(word)) return true;
      }
      return false;
    }

    /* 관심 종목 기반 RSS 소스 자동 생성 */
    function buildRSSSourcesFromWatchlist() {
      const sources = [];

      watchlist.forEach(item => {
        const ticker = item.symbol.split(':')[1];

        // 영문명 검색 (예: "NVIDIA")
        sources.push({
          query: item.name,
          ticker: ticker,
          icon: '📊'
        });

        // 한글명 검색 (사전에 있으면)
        const koreanNames = getKoreanNames(ticker);
        koreanNames.forEach(koreanName => {
          sources.push({
            query: koreanName,
            ticker: ticker,
            icon: '📊'
          });
        });
      });

      // 매크로 보조 (고정 3개)
      sources.push({ query: '연준 금리', ticker: 'MACRO', icon: '🏛️' });
      sources.push({ query: '미국 증시 마감', ticker: 'MACRO', icon: '🏛️' });
      sources.push({ query: '빅테크 실적', ticker: 'MACRO', icon: '🏛️' });

      return sources;
    }

    async function fetchFromRSS(source) {
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(source.query)}&hl=ko`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        if (data.status !== 'ok') return [];
        return data.items
          .filter(item => !isJunkNews(item.title))
          .slice(0, 3)  // 종목당 3건
          .map(item => ({
            time: formatRSSTime(item.pubDate),
            icon: source.icon,
            ticker: source.ticker,
            headline: item.title,
            link: item.link
          }));
      } catch (error) { return []; }
    }

    function formatRSSTime(pubDate) {
      const date = new Date(pubDate);
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${month}/${day} ${hours}:${minutes}`;
    }

    function getTimestamp(timeStr) {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;
      const [datePart, timePart] = timeStr.split(' ');
      const [month, day] = datePart.split('/').map(Number);
      const [hour, minute] = (timePart || '00:00').split(':').map(Number);
      let year = currentYear;
      if (month > currentMonth) year = currentYear - 1;
      return new Date(year, month - 1, day, hour, minute).getTime();
    }

    function renderNews() {
      const container = document.getElementById('news-list');
      document.getElementById('news-count').textContent = `${newsData.length}건`;

      if (newsData.length === 0) {
        container.innerHTML = '<div class="placeholder-msg">뉴스 로딩 중...</div>';
        return;
      }

      // 상위 30건 표시
      const top = newsData.slice(0, 30);

      container.innerHTML = top.map(news => {
        const tickerClass = news.ticker === 'MACRO' ? 'news-ticker macro' : 'news-ticker';
        return `
          <div class="news-item-mini" onclick="window.open('${news.link}', '_blank')">
            <div class="news-mini-time">
              <span class="${tickerClass}">${news.ticker}</span>
              ${news.time}
            </div>
            <div class="news-mini-headline">${news.headline}</div>
          </div>
        `;
      }).join('');
    }

    async function loadNews() {
      try {
        const sources = buildRSSSourcesFromWatchlist();
        console.log(`뉴스 로딩 - ${sources.length}개 소스`);

        const allRssNews = await Promise.all(
          sources.map(source => fetchFromRSS(source))
        );

        const flatRssNews = allRssNews.flat();
        const seen = new Set();
        const uniqueRssNews = flatRssNews.filter(item => {
          if (seen.has(item.headline)) return false;
          seen.add(item.headline);
          return true;
        });

        newsData = uniqueRssNews;
        newsData.sort((a, b) => getTimestamp(b.time) - getTimestamp(a.time));
        renderNews();

        const now = new Date();
        document.getElementById('last-update').textContent = now.toLocaleString('ko-KR');
      } catch (error) {
        console.error('뉴스 불러오기 실패:', error);
      }
    }

    function getRefreshInterval() {
      const market = getMarketStatus();
      if (market.status === 'regular') return 60 * 1000;
      if (market.status === 'pre' || market.status === 'post') return 2 * 60 * 1000;
      return 30 * 60 * 1000;
    }

    let priceRefreshTimer = null;
    function schedulePriceRefresh() {
      if (priceRefreshTimer) clearTimeout(priceRefreshTimer);
      const interval = getRefreshInterval();
      priceRefreshTimer = setTimeout(() => {
        loadAllUSPrices();
        schedulePriceRefresh();
      }, interval);
    }

    setInterval(renderTimeAndMarket, 1000);
    setInterval(loadNews, 10 * 60 * 1000);

    renderTimeAndMarket();
    renderFilterBar();
    renderWatchlist();
    renderEvents();
    setupModal();
    setupEventForm();
    loadAllUSPrices();
    loadNews();
    schedulePriceRefresh();
  </script>
</body>
</html>
