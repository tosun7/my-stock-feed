<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Stock Feed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f1115;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      min-height: 100vh;
      padding: 20px 12px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .channel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #1a1d24;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid #2a2d34;
    }

    .channel-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2a4d8a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }

    .channel-info {
      flex: 1;
    }

    .channel-name {
      font-size: 15px;
      font-weight: 600;
      color: #6da3e8;
    }

    .channel-desc {
      font-size: 12px;
      color: #8a8a8a;
      margin-top: 2px;
    }

    .live-indicator {
      font-size: 11px;
      color: #6dd49e;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6dd49e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
      background: #1a1d24;
    }

    .stat {
      background: #22252c;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: #8a8a8a;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .filters {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      background: #1a1d24;
      overflow-x: auto;
      flex-wrap: wrap;
    }

    .filter-chip {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 14px;
      background: #2a2d34;
      color: #b0b0b0;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-chip:hover {
      background: #3a3d44;
    }

    .filter-chip.active {
      background: #2a4d8a;
      color: #fff;
    }

    .news-section {
      background: #1a1d24;
      padding: 12px 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .news-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      font-size: 14px;
      line-height: 1.5;
      border-bottom: 1px solid #2a2d34;
      cursor: pointer;
      transition: background 0.2s;
    }

    .news-item:hover {
      background: #22252c;
      margin: 0 -16px;
      padding: 12px 16px;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-icon {
      font-size: 16px;
      flex-shrink: 0;
      width: 22px;
    }

    .news-content {
      flex: 1;
      min-width: 0;
    }

    .news-time {
      color: #8a8a8a;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .news-headline {
      color: #e0e0e0;
    }

    .ticker {
      display: inline-block;
      padding: 1px 6px;
      background: #2a3d5c;
      color: #6da3e8;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
      vertical-align: middle;
    }

    .ticker.hot {
      background: #5c2a2a;
      color: #e88a8a;
    }

    .ticker.green {
      background: #1f4d3a;
      color: #6dd49e;
    }

    .footer {
      background: #1a1d24;
      padding: 14px 16px;
      border-radius: 0 0 12px 12px;
      text-align: center;
      font-size: 12px;
      color: #6a6a6a;
    }

    @media (max-width: 480px) {
      body { padding: 8px 0; }
      .container { padding: 0 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="channel-header">
      <div class="channel-avatar">VB</div>
      <div class="channel-info">
        <div class="channel-name">MY STOCK FEED</div>
        <div class="channel-desc">AI 인프라 + 메모리 + 매크로</div>
      </div>
      <div class="live-indicator">
        <span class="live-dot"></span>
        라이브
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">오늘 수집</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">실적</div>
        <div class="stat-value" id="stat-earning">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">매크로</div>
        <div class="stat-value" id="stat-macro">0</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-chip active" data-filter="all">전체</button>
      <button class="filter-chip" data-filter="memory">메모리/HBM</button>
      <button class="filter-chip" data-filter="power">AI 전력</button>
      <button class="filter-chip" data-filter="optic">광학/패키징</button>
      <button class="filter-chip" data-filter="bigtech">빅테크 capex</button>
      <button class="filter-chip" data-filter="earning">실적시즌</button>
      <button class="filter-chip" data-filter="macro">매크로</button>
    </div>

    <div class="news-section">
      <div class="section-title">📰 최신 뉴스</div>
      <div id="news-list">
      </div>
    </div>

    <div class="footer">
      마지막 업데이트: <span id="last-update">-</span>
    </div>
  </div>

  <script>
   let newsData = [];

    function updateStats() {
      document.getElementById('stat-total').textContent = newsData.length;
      document.getElementById('stat-earning').textContent =
        newsData.filter(n => n.category === 'earning').length;
      document.getElementById('stat-macro').textContent =
        newsData.filter(n => n.category === 'macro').length;
    }

    function renderNewsItem(news) {
      const tickerHtml = news.ticker
        ? `<span class="ticker ${news.tickerType || ''}">${news.ticker}</span>`
        : '';

      return `
        <div class="news-item">
          <span class="news-icon">${news.icon}</span>
          <div class="news-content">
            <div class="news-time">${news.time}</div>
            <div class="news-headline">${news.headline}${tickerHtml}</div>
          </div>
        </div>
      `;
    }

    function renderNews(filter = 'all') {
      const filtered = filter === 'all'
        ? newsData
        : newsData.filter(n => n.category === filter);

      const html = filtered.map(renderNewsItem).join('');
      document.getElementById('news-list').innerHTML = html ||
        '<div style="text-align: center; padding: 30px; color: #6a6a6a;">해당 카테고리 뉴스 없음</div>';
    }

    function updateTimestamp() {
      const now = new Date();
      const formatted = now.toLocaleString('ko-KR');
      document.getElementById('last-update').textContent = formatted;
    }

    function setupFilters() {
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          renderNews(chip.dataset.filter);
        });
      });
    }

    async function fetchFromRSS(rssUrl, category, defaultIcon) {
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

  try {
    const response = await fetch(apiUrl);
    const data = await response.json();

    if (data.status !== 'ok') {
      console.error('RSS 가져오기 실패:', rssUrl);
      return [];
    }

    return data.items.slice(0, 10).map(item => ({
      time: formatRSSTime(item.pubDate),
      category: category,
      icon: defaultIcon,
      headline: item.title,
      ticker: null,
      tickerType: null,
      link: item.link
    }));
  } catch (error) {
    console.error('RSS 에러:', error);
    return [];
  }
}

function formatRSSTime(pubDate) {
  const date = new Date(pubDate);
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${month}/${day} ${hours}:${minutes}`;
}

async function loadNews() {
  try {
    const localResponse = await fetch('news.json');
    const localNews = await localResponse.json();

    const rssNews = await fetchFromRSS(
      'https://news.google.com/rss/search?q=SK하이닉스&hl=ko',
      'memory',
      '📄'
    );

    newsData = [...rssNews, ...localNews];

    newsData.sort((a, b) => b.time.localeCompare(a.time));

    updateStats();
    renderNews();
    updateTimestamp();
  } catch (error) {
    console.error('뉴스 불러오기 실패:', error);
  }
}

    loadNews();
    setupFilters();
  </script>
</body>
</html>
