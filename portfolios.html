<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빅테크 포트폴리오 - My Stock Feed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1115;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      min-height: 100vh;
      padding: 16px;
    }

    .layout { max-width: 1200px; margin: 0 auto; }

    .nav-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: #1a1d24;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      margin-bottom: 12px;
    }
    .nav-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: #2a4d8a; display: flex;
      align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px; color: #fff;
    }
    .nav-title {
      font-size: 15px; font-weight: 600; color: #6da3e8;
      flex: 1;
    }
    .nav-links {
      display: flex; gap: 8px;
    }
    .nav-link {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #b0b0b0;
      text-decoration: none;
      background: #2a2d34;
      transition: all 0.2s;
    }
    .nav-link:hover { background: #3a3d44; color: #e0e0e0; }
    .nav-link.active { background: #2a4d8a; color: #fff; }

    .company-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #1a1d24;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      margin-bottom: 12px;
      overflow-x: auto;
    }
    .company-tab {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #b0b0b0;
      background: #2a2d34;
      cursor: pointer;
      border: none;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .company-tab:hover { background: #3a3d44; color: #e0e0e0; }
    .company-tab.active {
      background: #2a4d8a;
      color: #fff;
    }

    .company-summary {
      background: #1a1d24;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .company-summary h1 {
      font-size: 24px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .company-ticker {
      font-size: 13px;
      padding: 4px 10px;
      background: #2a3d5c;
      color: #6da3e8;
      border-radius: 6px;
      font-weight: 500;
    }
    .company-meta {
      display: flex;
      gap: 24px;
      margin: 12px 0;
      font-size: 13px;
      color: #8a8a8a;
    }
    .company-meta strong {
      color: #e0e0e0;
      font-size: 16px;
      font-weight: 600;
    }
    .company-description {
      font-size: 14px;
      line-height: 1.6;
      color: #b0b0b0;
      margin-top: 8px;
    }
    .thesis-note {
      margin-top: 16px;
      padding: 12px 14px;
      background: #22252c;
      border-left: 3px solid #6dd49e;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      color: #c0c0c0;
      font-style: italic;
    }

    /* 메인 그리드 - 섹터(왼) + 블로그 RSS(오) */
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    @media (max-width: 1000px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    .sectors-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 800px) {
      .sectors-grid { grid-template-columns: 1fr; }
    }

    .sector-card {
      background: #1a1d24;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      padding: 18px 20px;
      border-top: 3px solid #6da3e8;
    }

    .sector-card.color-blue { border-top-color: #6da3e8; }
    .sector-card.color-purple { border-top-color: #b794f4; }
    .sector-card.color-amber { border-top-color: #ed8936; }
    .sector-card.color-pink { border-top-color: #ed64a6; }
    .sector-card.color-green { border-top-color: #6dd49e; }
    .sector-card.color-teal { border-top-color: #4fd1c5; }
    .sector-card.color-red { border-top-color: #fc8181; }

    .sector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sector-title {
      font-size: 16px;
      font-weight: 600;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sector-amount {
      font-size: 16px;
      font-weight: 600;
      color: #6dd49e;
    }
    .sector-card.color-purple .sector-amount { color: #b794f4; }
    .sector-card.color-amber .sector-amount { color: #ed8936; }
    .sector-card.color-pink .sector-amount { color: #ed64a6; }
    .sector-card.color-blue .sector-amount { color: #6da3e8; }
    .sector-card.color-teal .sector-amount { color: #4fd1c5; }

    .companies-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .company-chip {
      font-size: 11px;
      padding: 5px 10px;
      background: #22252c;
      color: #c0c0c0;
      border-radius: 12px;
      border: 1px solid #2a2d34;
    }

    .sector-card.color-blue .company-chip {
      background: #1a2d40; color: #b5d4f4; border-color: #2a3d5c;
    }
    .sector-card.color-purple .company-chip {
      background: #2a1d40; color: #cebbf6; border-color: #3a2d5c;
    }
    .sector-card.color-amber .company-chip {
      background: #3d2a14; color: #fac775; border-color: #5c3d20;
    }
    .sector-card.color-pink .company-chip {
      background: #3d1a2a; color: #f4c0d1; border-color: #5c2a3d;
    }
    .sector-card.color-green .company-chip {
      background: #1a3d2a; color: #c0dd97; border-color: #2a5c3d;
    }
    .sector-card.color-teal .company-chip {
      background: #1a3d3a; color: #9fe1cb; border-color: #2a5c54;
    }

    .sector-thesis {
      padding: 12px 14px;
      background: #22252c;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      color: #b0b0b0;
    }
    .sector-thesis-label {
      font-size: 11px;
      font-weight: 600;
      color: #8a8a8a;
      margin-bottom: 4px;
    }

    /* 블로그 RSS 사이드바 */
    .blog-sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .blog-box {
      background: #1a1d24;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      padding: 14px 16px;
    }

    .blog-title {
      font-size: 14px;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .blog-subtitle {
      font-size: 11px;
      color: #8a8a8a;
      margin-bottom: 12px;
    }

    .blog-item {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid #2a2d34;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
    }

    .blog-item:hover {
      background: #22252c;
      margin: 0 -16px;
      padding: 10px 16px;
    }

    .blog-item:last-child { border-bottom: none; }

    .blog-date {
      font-size: 10px;
      color: #6da3e8;
      margin-bottom: 4px;
    }

    .blog-headline {
      font-size: 12px;
      color: #e0e0e0;
      line-height: 1.4;
    }

    .blog-loading {
      font-size: 11px;
      color: #6a6a6a;
      text-align: center;
      padding: 20px 8px;
      font-style: italic;
    }

    .footer {
      background: #1a1d24;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #2a2d34;
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #6a6a6a;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6a6a6a;
      font-size: 14px;
    }

    .placeholder-data {
      opacity: 0.5;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="layout">

    <div class="nav-header">
      <div class="nav-avatar">VB</div>
      <div class="nav-title">MY STOCK FEED</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">📰 뉴스</a>
        <a href="portfolios.html" class="nav-link active">🏢 포트폴리오</a>
      </div>
    </div>

    <div class="company-tabs" id="company-tabs">
    </div>

    <div id="company-content">
      <div class="empty-state">
        데이터 로딩 중...
      </div>
    </div>

    <div class="footer">
      마지막 업데이트: <span id="last-update">-</span>
    </div>
  </div>

  <script>
    /* 회사별 블로그 RSS 매핑 */
    const COMPANY_RSS = {
      'nvidia': [
        {
          name: 'NVIDIA Blog',
          url: 'https://blogs.nvidia.com/feed/',
          icon: '📝'
        },
        {
          name: 'NVIDIA News',
          url: 'https://nvidianews.nvidia.com/releases.xml',
          icon: '📢'
        }
      ]
      // 나중에 다른 회사 추가 가능:
      // 'microsoft': [...],
      // 'google': [...]
    };

    let portfolioData = null;
    let currentCompanyId = null;

    async function loadPortfolios() {
      try {
        const response = await fetch('portfolios.json');
        portfolioData = await response.json();

        document.getElementById('last-update').textContent = portfolioData.lastUpdated;

        renderCompanyTabs();

        if (portfolioData.companies.length > 0) {
          showCompany(portfolioData.companies[0].id);
        }
      } catch (error) {
        console.error('포트폴리오 로드 실패:', error);
        document.getElementById('company-content').innerHTML = `
          <div class="empty-state">
            데이터를 불러올 수 없습니다. portfolios.json 파일을 확인해주세요.
          </div>
        `;
      }
    }

    function renderCompanyTabs() {
      const container = document.getElementById('company-tabs');
      container.innerHTML = portfolioData.companies.map(company => `
        <button class="company-tab" data-id="${company.id}">
          ${company.name}
        </button>
      `).join('');

      container.querySelectorAll('.company-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          showCompany(tab.dataset.id);
        });
      });
    }

    function showCompany(companyId) {
      currentCompanyId = companyId;

      document.querySelectorAll('.company-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.id === companyId);
      });

      const company = portfolioData.companies.find(c => c.id === companyId);
      if (!company) return;

      const content = document.getElementById('company-content');

      const summaryHtml = `
        <div class="company-summary">
          <h1>
            ${company.name}
            <span class="company-ticker">${company.ticker}</span>
          </h1>
          <div class="company-meta">
            <div>총 투자: <strong>${company.totalInvestment}</strong></div>
            <div>섹터: <strong>${company.sectors.length}개</strong></div>
          </div>
          <div class="company-description">${company.description}</div>
          ${company.thesisNote ? `<div class="thesis-note">${company.thesisNote}</div>` : ''}
        </div>
      `;

      // 메인 콘텐츠: 섹터 카드 + 블로그 사이드바
      const mainContent = `
        <div class="content-grid">
          <div class="sectors-grid">
            ${company.sectors.map(sector => renderSectorCard(sector)).join('')}
          </div>
          <div class="blog-sidebar" id="blog-sidebar">
            ${renderBlogPlaceholder(companyId)}
          </div>
        </div>
      `;

      content.innerHTML = summaryHtml + mainContent;

      // 해당 회사의 블로그 RSS 로드
      loadCompanyBlogs(companyId);
    }

    function renderSectorCard(sector) {
      const color = sector.color || 'blue';
      const isPlaceholder = sector.totalAmount === 'TBD';

      const companiesHtml = sector.companies.map(c => {
        const isPlaceholderCompany = c.amount.includes('데이터 입력 필요');
        const className = isPlaceholderCompany ? 'company-chip placeholder-data' : 'company-chip';
        return `<span class="${className}">${c.name}${c.amount && !isPlaceholderCompany ? ' ' + c.amount : ''}</span>`;
      }).join('');

      return `
        <div class="sector-card color-${color} ${isPlaceholder ? 'placeholder-data' : ''}">
          <div class="sector-header">
            <div class="sector-title">
              <span>${sector.icon}</span>
              <span>${sector.name}</span>
            </div>
            <div class="sector-amount">${sector.totalAmount}</div>
          </div>
          <div class="companies-list">
            ${companiesHtml}
          </div>
          <div class="sector-thesis">
            <div class="sector-thesis-label">투자 논리</div>
            ${sector.thesis}
          </div>
        </div>
      `;
    }

    function renderBlogPlaceholder(companyId) {
      const sources = COMPANY_RSS[companyId];
      if (!sources || sources.length === 0) {
        return `
          <div class="blog-box">
            <div class="blog-title">📡 공식 소식</div>
            <div class="blog-loading">
              ${portfolioData.companies.find(c => c.id === companyId)?.name || ''} 블로그 RSS 미등록
            </div>
          </div>
        `;
      }

      return sources.map(source => `
        <div class="blog-box">
          <div class="blog-title">${source.icon} ${source.name}</div>
          <div class="blog-subtitle">최신 공식 소식</div>
          <div id="blog-${source.url.replace(/[^a-z0-9]/gi, '_')}" class="blog-list">
            <div class="blog-loading">로딩 중...</div>
          </div>
        </div>
      `).join('');
    }

    async function loadCompanyBlogs(companyId) {
      const sources = COMPANY_RSS[companyId];
      if (!sources) return;

      for (const source of sources) {
        const containerId = 'blog-' + source.url.replace(/[^a-z0-9]/gi, '_');
        const container = document.getElementById(containerId);
        if (!container) continue;

        try {
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`;
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (data.status !== 'ok' || !data.items || data.items.length === 0) {
            container.innerHTML = '<div class="blog-loading">소식을 불러올 수 없습니다</div>';
            continue;
          }

          const items = data.items.slice(0, 8);
          container.innerHTML = items.map(item => {
            const date = new Date(item.pubDate);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const dateStr = `${date.getFullYear()}.${month}.${day}`;

            return `
              <a href="${item.link}" target="_blank" class="blog-item">
                <div class="blog-date">${dateStr}</div>
                <div class="blog-headline">${item.title}</div>
              </a>
            `;
          }).join('');
        } catch (error) {
          console.error('블로그 로드 실패:', source.name, error);
          container.innerHTML = '<div class="blog-loading">로드 실패</div>';
        }
      }
    }

    loadPortfolios();
  </script>
</body>
</html>
